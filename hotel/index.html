<!DOCTYPE html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stay Finder - Home</title>

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN GRID
        ========================= */

        .grid {
            display: grid;

            grid-template-columns: 250px 1fr 1fr;

            grid-template-areas:
                "nav nav nav"
                "sidebar main main"
                "footer footer footer";

            min-height: 100vh;
            gap: 20px;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {
            grid-area: nav;

            border: 2px solid black;
            border-radius: 30px;
            margin: 10px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 50px;
        }

        .name {
            color: rgb(21, 205, 234);
            font-family: cursive;
            font-size: 30px;
            font-weight: bold;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 50px;
            font-size: 20px;
        }

        a {
            color: black;
            text-decoration: none;
        }

        a:hover {
            color: rgb(21, 205, 234);
            font-family: cursive;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .side-bar {
            grid-area: sidebar;

            padding: 20px;
        }

        .side-bar h2 {
            color: rgb(208, 18, 66);
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            grid-area: main;

            padding: 20px;
        }

        .im_hotel {
            position: relative;
        }

        .im_hotel img {
            width: 100%;
            height: 400px;
            object-fit: cover;

            border-radius: 2em;
        }

        .im_hotel h1 {
            position: absolute;

            top: 40%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 100%;

            text-align: center;

            color: rgb(208, 18, 66);
            font-size: 3em;

            text-shadow: 2px 2px 9px white;
        }


        /* =========================
           BOOK BUTTON
        ========================= */

        .book {
            text-align: center;

            border: 4px solid rgb(21, 205, 234);
            border-radius: 3em;

            width: 300px;

            margin: 30px auto;
            padding: 5px;
        }

        .book:hover {
            background-color: rgb(193, 245, 245);
            cursor: pointer;
        }


        hr {
            border: 1px solid rgb(21, 205, 234);
        }


        /* =========================
           HOTEL CARDS
        ========================= */

        .hotel {
            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        .pc,
        .sarena,
        .royale,
        .avari {
            border: 6px solid;
            border-radius: 2em;

            background-color: rgb(193, 245, 245);

            padding: 10px;

            text-align: center;
        }

        .pc img,
        .sarena img,
        .royale img,
        .avari img {
            width: 100%;
            height: 180px;

            object-fit: cover;

            border-radius: 1.5em;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            grid-area: footer;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 25px 50px;

            background: rgb(21, 205, 234);

            color: white;

            border-radius: 2em;

            margin: 10px;
        }

        .footer h3 {
            font-family: cursive;
        }

        .footer .link {
            display: flex;
            gap: 25px;
        }

        .footer a {
            color: white;
            text-decoration: none;
        }

        .footer a:hover {
            color: black;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "nav"
                    "main"
                    "sidebar"
                    "footer";
            }

            .nav {
                flex-direction: column;
                gap: 20px;

                padding: 20px;
            }

            .links {
                flex-wrap: wrap;
                gap: 20px;
            }

            .footer {
                flex-direction: column;
                gap: 20px;

                text-align: center;
            }

            .footer .link {
                flex-wrap: wrap;
                justify-content: center;
            }

            .im_hotel h1 {
                font-size: 2em;
            }
        }

    </style>
</head>


<body>

    <div class="grid">


        <!-- =========================
             NAVIGATION
        ========================== -->

        <nav class="navigation">

            <div class="nav">

                <div class="name">
                    Stay Finder
                </div>

                <div class="links">

                    <a href="home.html">Home</a>

                    <a href="rooms.html">Rooms</a>

                    <a href="about.html">About</a>

                    <a href="contact.html">Contact</a>

                    <a href="login.html">Login</a>

                </div>

            </div>

        </nav>


        <!-- =========================
             SIDEBAR
        ========================== -->

        <div class="side-bar">

            <h2>Popular Destinations:</h2>

            <div class="hotel">


                <!-- Sarena -->

                <div class="sarena">

                    <h3>Sarena Hotel (Islamabad)</h3>

                    <img
                        src="home/sarena.jpeg"
                        alt="Sarena Hotel Islamabad"
                    >

                </div>


                <!-- Royale Swiss -->

                <div class="royale">

                    <h3>Royale Swiss Hotel (Lahore)</h3>

                    <img
                        src="home/royal-swiss.jpeg"
                        alt="Royale Swiss Hotel Lahore"
                    >

                </div>


                <!-- Pearl Continental -->

                <div class="pc">

                    <h3>Pearl Continental (Lahore)</h3>

                    <img
                        src="home/pearl continental.jpeg"
                        alt="Pearl Continental Lahore"
                    >

                </div>


                <!-- Avari -->

                <div class="avari">

                    <h3>Avari Hotel (Karachi)</h3>

                    <img
                        src="home/avari hotel.jpeg"
                        alt="Avari Hotel Karachi"
                    >

                </div>

            </div>

        </div>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main">

            <div class="im_hotel">

                <img
                    src="hotel room.jpeg"
                    alt="Beautiful hotel room"
                >

                <h1>
                    We Find Hotels for You!
                </h1>

            </div>


            <div class="book">

                <h2>
                    Book Your Room Now!
                </h2>

            </div>

            <hr>

        </main>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="footer">

            <h3>
                Stay Finder
            </h3>


            <div class="link">

                <a href="home.html">Home</a>

                <a href="rooms.html">Rooms</a>

                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>

            </div>


            <p>
                © 2026 Stay Finder
                <br>
                All rights reserved
            </p>

        </footer>


    </div>

</body>

</html>
